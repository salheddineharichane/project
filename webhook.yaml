import os
import sys
import base64
import json
from flask import Flask, request, jsonify
from kubernetes import client, config

app = Flask(__name__)
config.load_incluster_config()

@app.route('/mutate', methods=['POST'])
def mutate():
    req = request.get_json()
    svc = req['request']['object']

    if svc.get('spec', {}).get('type') != 'LoadBalancer':
        return admission_response(req)

    api = client.CustomObjectsApi()
    ics = api.list_cluster_custom_object(
        group="operator.openshift.io",
        version="v1",
        plural="ingresscontrollers",
        _request_timeout=5,
    )['items']

    for ic in ics:
        endpoint_publishing = ic['spec'].get('endpointPublishingStrategy', {})
        if endpoint_publishing.get('type') == 'HostNetwork':
            continue

        ic_name = ic['metadata']['name']
        domain = ic['status'].get('domain')
        svc_name = svc['metadata']['name']

        if svc_name == f"router-{ic_name}":
            annotation_key = "external-dns.alpha.kubernetes.io/hostname"
            annotation_value = f"{svc_name}.{domain}"
            print(f"[INFO] Annotation à appliquer sur {svc_name}: {annotation_key}={annotation_value}", file=sys.stderr)
            return admission_response(req, svc, annotation_key, annotation_value)

    return admission_response(req)


def admission_response(req, svc=None, annotation_key=None, annotation_value=None):
    resp = {
        "apiVersion": "admission.k8s.io/v1",
        "kind": "AdmissionReview",
        "response": {
            "uid": req["request"]["uid"],
            "allowed": True,
        }
    }

    if annotation_key and annotation_value and svc is not None:
        existing_annotations = svc.get('metadata', {}).get('annotations') or {}
        
        # ✅ "replace" si l'annotation existe déjà, "add" sinon
        op = "replace" if annotation_key in existing_annotations else "add"

        patch = [{
            "op": op,
            "path": f"/metadata/annotations/{annotation_key.replace('/', '~1')}",
            "value": annotation_value
        }]

        print(f"[DEBUG] Op: {op} | Patch: {patch}", file=sys.stderr)
        patch_bytes = json.dumps(patch).encode()
        resp["response"]["patchType"] = "JSONPatch"
        resp["response"]["patch"] = base64.b64encode(patch_bytes).decode()

    return jsonify(resp)


if __name__ == '__main__':
    app.run(
        host='0.0.0.0',
        port=8443,
        ssl_context=(os.environ["SSL_CERT_FILE"], os.environ["SSL_KEY_FILE"])
    )


La fonctionnalité ajoutée à external-dns v0.21.0 permet d'émettre des Kubernetes Events directement sur les ressources Service, Ingress, OCP Route et HTTPRoute. Quand external-dns crée ou met à jour un enregistrement DNS avec succès, un event RecordReady est émis sur la ressource concernée. Si le hostname est déjà géré par une autre ressource Kubernetes, que ce soit dans le même cluster ou dans un cluster distant, un event Warning RecordConflict est émis sur la ressource conflictuelle en précisant quelle ressource possède déjà cet enregistrement DNS et, le cas échéant, de quel cluster il provient. Ces événements sont visibles directement via oc describe sur la ressource, sans avoir à consulter les logs du pod external-dns.
